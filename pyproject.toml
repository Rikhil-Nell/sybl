[project]
name = "sybl"
version = "0.1.1"
description = "Open-source BYOK voice dictation — speak anywhere, transcribe fast, type it in."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rikhil Nellimarla", email = "nrikhil@gmail.com" }]
keywords = ["dictation", "speech-to-text", "byok", "voice", "typer", "transcription"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "deepgram-sdk>=7.4.0,<8",
    "groq>=1.5.0,<2",
    "keyring>=25.0.0,<26",
    "numpy>=2.0.0,<3",
    "platformdirs>=4.0.0,<5",
    "pynput>=1.7.0,<2",
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "sounddevice>=0.5.0,<1",
    "soundfile>=0.12.0,<1",
    "soxr>=0.5.0,<1",
    "tenacity>=9.1.4,<10",
    "textual>=0.85.0,<9",
    "tomli-w>=1.0.0,<2",
    "typer>=0.12.0,<1",
]

[project.scripts]
sybl = "sybl.cli:app"

[project.urls]
Homepage = "https://github.com/Rikhil-Nell/sybl"
Documentation = "https://github.com/Rikhil-Nell/sybl/tree/main/docs"
Repository = "https://github.com/Rikhil-Nell/sybl"
Issues = "https://github.com/Rikhil-Nell/sybl/issues"
Changelog = "https://github.com/Rikhil-Nell/sybl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "keyrings.alt>=5.0.0,<6",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "ruff>=0.8.0,<1",
]

[dependency-groups]
dev = [
    "keyrings.alt>=5.0.0,<6",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "ruff>=0.8.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sybl"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require real microphone hardware or live STT API keys",
]

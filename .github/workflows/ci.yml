name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    env:
      NO_COLOR: "1"
      TERM: dumb
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev xvfb

      - name: Install dependencies
        run: uv sync

      - name: Install Linux keyring backend
        if: runner.os == 'Linux'
        run: uv pip install keyrings.alt

      - name: Lint
        run: uv run ruff check navi tests

      - name: Unit tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run uv run pytest -m "not integration" -q --ignore=tests/test_inject.py

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -m "not integration" -q
